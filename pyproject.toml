[project]
name = "datafest"
version = "0.1.0"
description = "Temporal conversion propensity modeling with auditable experiment lineage"
requires-python = ">=3.12,<3.13"
dependencies = [
  "catboost==1.2.8",
  "lightgbm==4.6.0",
  "numpy==2.4.4",
  "pandas==3.0.2",
  "scikit-learn==1.8.0",
  "scipy==1.18.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5"]
kumo = [
    "structured-data-models",
]

[project.scripts]
datafest = "datafest.cli:main"
datafest-kumo = "datafest.kumo:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/datafest"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"

[tool.uv.sources]
structured-data-models = { git = "https://github.com/NVIDIA/structured-data-models.git", rev = "b982fbf4188ea8db17249fe81338723106100b63" }
